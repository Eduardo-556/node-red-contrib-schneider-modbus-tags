<script type="text/javascript">
    RED.nodes.registerType('schneider-plc', {
        category: 'config',
        defaults: {
            name: { value: '' },
            model: { value: 'M221' },
            host: { value: '', required: true },
            port: { value: 502, required: true, validate: RED.validators.number() },
            unitId: { value: 1, required: true, validate: RED.validators.number() },
            timeout: { value: 3000, validate: RED.validators.number() },
            reconnectDelay: { value: 5000, validate: RED.validators.number() },
            maxQuantity: { value: 120, validate: function (v) { v = Number(v); return v >= 1 && v <= 125; } }
        },
        label: function () { return this.name || (this.host + ':' + this.port); }
    });
</script>

<script type="text/html" data-template-name="schneider-plc">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="CLP OP1475">
    </div>
    <div class="form-row">
        <label for="node-config-input-model"><i class="fa fa-microchip"></i> Model</label>
        <select id="node-config-input-model">
            <option value="M221">M221</option>
            <option value="M241">M241</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-host"><i class="fa fa-globe"></i> IP</label>
        <input type="text" id="node-config-input-host" placeholder="10.0.0.10">
    </div>
    <div class="form-row">
        <label for="node-config-input-port">Port</label>
        <input type="text" id="node-config-input-port" style="width:80px">
        <label for="node-config-input-unitId" style="margin-left:20px">Unit id</label>
        <input type="text" id="node-config-input-unitId" style="width:60px">
    </div>
    <div class="form-row">
        <label for="node-config-input-timeout">Timeout (ms)</label>
        <input type="text" id="node-config-input-timeout" style="width:80px">
    </div>
    <div class="form-row">
        <label for="node-config-input-reconnectDelay">Reconnect (ms)</label>
        <input type="text" id="node-config-input-reconnectDelay" style="width:80px">
    </div>
    <div class="form-row">
        <label for="node-config-input-maxQuantity">Max per read</label>
        <input type="text" id="node-config-input-maxQuantity" style="width:80px"> registers
    </div>
</script>

<script type="text/html" data-help-name="schneider-plc">
    <p>Modbus TCP connection to a Schneider M221 or M241 controller.</p>
    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Model</dt><dd>Sets where <code>%MF</code> and <code>%MD</code> sit: on the M221 <code>%MD4</code> is <code>%MW4</code>-<code>%MW5</code>, on the M241 it is <code>%MW8</code>-<code>%MW9</code>.</dd>
        <dt>IP / Port</dt><dd>Controller address, port 502 by default.</dd>
        <dt>Unit id</dt><dd>1 by default. Change it only if your PLC's Modbus server is set to another id.</dd>
        <dt>Timeout</dt><dd>How long to wait for each answer.</dd>
        <dt>Reconnect</dt><dd>Wait after a failure before opening the connection again.</dd>
        <dt>Max per read</dt><dd>Largest block read in one request (1 to 125).</dd>
    </dl>
    <p>This is a configuration node: it does not appear in the palette. Create it from the PLC field of a <b>schneider read</b> node. Several read nodes can share one connection; their requests are queued.</p>
</script>
