<script type="text/html" data-template-name="schneider-read">

        <textarea id="node-input-tags" rows="12" style="width:100%; font-family:monospace; white-space:pre" placeholder="MF0 temperatura&#10;MD2 contador&#10;MW10 setpoint&#10;MW20 string[20] lote"></textarea>
    </div>

<script type="text/html" data-help-name="schneider-read">
    <p>Reads <code>%MW</code> memory from a Schneider M221 or M241 over Modbus TCP and sends the decoded values.</p>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>One key per tag, e.g. <code>{ velocidade: 23.5, codigo_bobina: "B1234" }</code>.</dd>
        <dt>timestamp <span class="property-type">number</span></dt>
        <dd>Time of the read in milliseconds.</dd>
    </dl>
    <p>Close addresses are grouped into as few requests as possible. Any input message triggers a read and is passed through with the new payload.</p>
    <h3>Tag list</h3>
    <p>One tag per line: <code>address type name</code>. Type and name are optional. Use the same addresses as in SoMachine / Machine Expert:</p>
    <pre>MF0     temperatura
MD4     contador
MW10    setpoint
MW12.3  motor_ligado
MW60200 bool       plc_run
MW60206 float      velocidade
MW60210 string[20] codigo_bobina
MW60222 int        bobinas_prontas
MW60226 dint       horas
MW60300 bool.3     motor_ligado</pre>
    <table>
        <tr><th>Type</th><th>Registers</th><th>Value</th></tr>
        <tr><td><code>bool</code></td><td>1</td><td>whole word, true when not 0</td></tr>
        <tr><td><code>bool.N</code></td><td>1</td><td>bit N (0 to 15) of the word</td></tr>
        <tr><td><code>int</code></td><td>1</td><td>signed 16-bit</td></tr>
        <tr><td><code>uint</code> / <code>word</code></td><td>1</td><td>unsigned 16-bit</td></tr>
        <tr><td><code>dint</code></td><td>2</td><td>signed 32-bit (<code>%MD</code>)</td></tr>
        <tr><td><code>udint</code> / <code>dword</code></td><td>2</td><td>unsigned 32-bit</td></tr>
        <tr><td><code>float</code> / <code>real</code></td><td>2</td><td>32-bit REAL (<code>%MF</code>)</td></tr>
        <tr><td><code>string[N]</code></td><td>N/2</td><td>N ASCII characters, ends at the first 0 byte</td></tr>
    </table>
    <p>Without a type, <code>MW</code> is <code>int</code>, <code>MF</code> is <code>float</code> and <code>MD</code> is <code>dint</code>. Where <code>MF</code>/<code>MD</code> sit depends on the PLC model (M221 or M241). <code>%MW100</code>, <code>MW100</code>, <code>mw100</code> and <code>MW100 : float</code> are all accepted. Lines starting with <code>#</code> are comments.</p>
    <h3>Byte order</h3>
    <p>M221 and M241 store 32-bit values with the low word first and strings with the first character in the low byte. Change the options only for devices that use another order.</p>
</script>
